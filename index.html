<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lingua Garden">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lingua Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar + one centered column; a lesson is a focused step-by-step player. Hanzi in serif is the display voice; pinyin is colored by tone; English carries an ink-blue badge, Chinese a cinnabar one. */
:root{
  --bg:#edf2ee; --surface:#ffffff; --surface-2:#e2ebe5; --ink:#17201c; --muted:#56665e; --line:#cbd8d0;
  --jade:#1d6b58; --jade-ink:#ffffff; --jade-soft:#d2e6dd; --seal:#b9402c; --seal-soft:#f5ddd6; --navy:#264f86; --navy-soft:#dde6f3; --gold:#b98a1f;
  --t1:#c23a33; --t2:#c27412; --t3:#23804a; --t4:#2a5cb3; --t0:#77827c;
  --ok:#1f7a4a; --ok-soft:#d7eedf; --bad:#b23a2c; --bad-soft:#f6dcd6;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-py:'Noto Sans','Be Vietnam Pro',system-ui,sans-serif;
  --f-hz:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211d; --surface-2:#212c26; --ink:#e4ebe7; --muted:#9aaba2; --line:#2d3a33;
  --jade:#5fbf9d; --jade-ink:#0d1a15; --jade-soft:#1f3a2f; --seal:#e46d57; --seal-soft:#3d221c; --navy:#8fb2ec; --navy-soft:#1e2b40; --gold:#e2b84f;
  --t1:#f06b62; --t2:#f0a642; --t3:#5cc47f; --t4:#76a0ee; --t0:#9aa59f;
  --ok:#5cc47f; --ok-soft:#1d3a28; --bad:#f07a6a; --bad-soft:#40211c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --surface-2:#212c26; --ink:#e4ebe7; --muted:#9aaba2; --line:#2d3a33;
  --jade:#5fbf9d; --jade-ink:#0d1a15; --jade-soft:#1f3a2f; --seal:#e46d57; --seal-soft:#3d221c; --navy:#8fb2ec; --navy-soft:#1e2b40; --gold:#e2b84f;
  --t1:#f06b62; --t2:#f0a642; --t3:#5cc47f; --t4:#76a0ee; --t0:#9aa59f;
  --ok:#5cc47f; --ok-soft:#1d3a28; --bad:#f07a6a; --bad-soft:#40211c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:24px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.brand .seal{width:34px;height:34px;border-radius:8px;background:var(--seal);color:#fff;display:grid;place-items:center;font:700 20px/1 var(--f-hz)}
.brand b{font-weight:700;font-size:1.05rem}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:9px 13px;border-radius:999px;font-weight:500;color:var(--muted);white-space:nowrap;min-height:42px;position:relative}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--seal);color:#fff;font-size:.72rem;font-weight:700;margin-left:4px;padding:0 5px}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--t0);display:inline-block}
.sync[data-s="cloud"] i{background:var(--ok)}
.sync[data-s="loading"] i{background:var(--gold)}

.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.ghost{background:transparent}
.btn.big{min-height:56px;padding:0 26px;font-size:1.05rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.hz{font-family:var(--f-hz);font-weight:600}
.py{font-family:var(--f-py);font-weight:600}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.now{background:var(--jade);color:var(--jade-ink)}
.lang{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;white-space:nowrap}
.lang.zh{background:var(--seal-soft);color:var(--seal)}
.lang.en{background:var(--navy-soft);color:var(--navy)}
.lang.mix{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px}
.note{border-radius:12px;background:var(--jade-soft);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.note.warn{background:var(--surface-2)}
.note ul{margin:0;padding-left:20px}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.hello{display:flex;flex-direction:column;gap:6px}

/* today */
.today{position:relative;overflow:hidden;gap:14px}
.today .glyph{position:absolute;right:-4px;top:-20px;font:700 130px/1 var(--f-hz);color:var(--jade-soft);pointer-events:none}
.today > *:not(.glyph){position:relative}
.parts{display:flex;flex-direction:column;gap:8px}
.parts div{display:flex;gap:10px;align-items:baseline}
.plantbox{display:flex;align-items:flex-end;gap:16px}
.plant{width:92px;height:84px;flex:none}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.82rem;color:var(--muted)}
.phase-bars{display:flex;flex-direction:column;gap:10px}
.phase-bars .ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.phase-bars .ph .bar{grid-column:1/-1}

/* path */
.level{display:flex;flex-direction:column;gap:10px}
.level-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lessons{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lessons .uhead{padding:12px 18px;background:var(--surface-2);display:flex;align-items:center;gap:10px;font-weight:600}
.lessons .uhead .hz{font-size:1.2rem}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 18px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:62px}
.lrow:last-child{border-bottom:0}
.lrow .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface-2);font-variant-numeric:tabular-nums;font-size:.9rem}
.lrow.done .n{background:var(--ok-soft);color:var(--ok)}
.lrow.now .n{background:var(--jade);color:var(--jade-ink)}
.lrow.locked{opacity:.5}
.lrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lrow .tx small{color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.locked-levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.locked-levels{grid-template-columns:1fr}}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.lv ul{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}

/* player */
.player{display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
.phead{display:flex;align-items:center;gap:12px}
.phead .bar{flex:1}
.pclose{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;flex:none;font-size:1.1rem}
.pcount{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbody{display:flex;flex-direction:column;gap:16px;min-height:50vh}
.pstep-head{display:flex;flex-direction:column;gap:6px}
.pfoot{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.goal-list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.goal-list li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.prose{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

/* chips & cards */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chip .hz{font-size:1.6rem;line-height:1.15}
.chip .py{font-size:.95rem}
.chip .w{font-weight:600;font-size:1.05rem}
.chip .ipa{font-family:var(--f-py);font-size:.85rem;color:var(--navy)}
.chip .vi{font-size:.75rem;color:var(--muted);max-width:130px;text-align:center;line-height:1.25}
.chip.en{border-color:var(--navy-soft)}
.chip:active{transform:scale(.97)}
.formula{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.formula .part{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:86px}
.formula .part b{font:600 1.6rem/1.2 var(--f-py)}
.formula .part span{font-size:.75rem;color:var(--muted)}
.formula .op{align-self:center;font-size:1.3rem;color:var(--muted)}
.fbox{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:1.15rem;font-weight:600}
.group{display:flex;flex-direction:column;gap:10px}
.group h3 small{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.sound{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.snd{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:96px}
.snd .top-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.snd .big{font:700 1.7rem/1 var(--f-py);color:var(--jade)}
.snd.en .big{color:var(--navy);font-size:1.25rem}
.snd .ex{font-size:.9rem}
.snd .tip{font-size:.78rem;color:var(--muted);line-height:1.35}
.tones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.tones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tonecard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.tonecard .hz{font-size:2rem;line-height:1.1}
.tonecard .desc{font-size:.8rem;color:var(--muted);line-height:1.35}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.pairs{grid-template-columns:1fr}}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pair .chips{gap:8px}
.pair p{font-size:.84rem;color:var(--muted)}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.wcard .hzbig{border:0;background:none;font:700 4.2rem/1.1 var(--f-hz);padding:0}
.wcard .wbig{border:0;background:none;font:700 2.2rem/1.2 var(--f-body);color:var(--navy);padding:0}
.wcard .pybig{font:600 1.6rem/1.2 var(--f-py)}
.wcard .mean{font-size:1.15rem}
.wcard .ex{width:100%;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:12px;align-items:flex-start;text-align:left}
.wcard .ex .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.wcard .ex .hz{font-size:1.25rem}
.playsm{border:0;background:var(--surface-2);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.playsm svg{width:20px;height:20px}
.exlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.exrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.exrow .hz{font-size:1.3rem}
.exrow .en{font-weight:600}
.mistakes{display:flex;flex-direction:column;gap:8px}
.mis{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.mis .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.mis .v{color:var(--ok);font-weight:600}
.dlg{display:flex;flex-direction:column;gap:10px}
.dl{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dl .who{flex:none;width:58px;font-size:.78rem;font-weight:700;color:var(--muted);padding-top:12px}
.dl .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.dl .hz{font-size:1.35rem}
.hide-py .dl .py,.hide-vi .dl .vi{visibility:hidden}
.sample{background:var(--navy-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sample p{line-height:1.6}
.timer{font:700 2rem/1 var(--f-py);font-variant-numeric:tabular-nums}
.words{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .hz{font-size:1.5rem;min-width:3.2em}
.wrow .w{font-weight:700;min-width:6em;color:var(--navy)}
.wrow .tx{flex:1;min-width:0}
.wrow .tx small{display:block;color:var(--muted)}
.save{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;display:inline-grid;place-items:center;color:var(--muted);padding:0 10px;flex:none}
.save.on{color:var(--gold);border-color:var(--gold)}
.save svg{width:20px;height:20px}
.save.on svg path{fill:currentColor}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px;max-width:680px}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-weight:600}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.dots i.d{background:var(--jade)}
.dots i.c{background:var(--gold)}
.qprompt{font-size:1.15rem;font-weight:600}
.qprompt .hz{font-size:1.3rem}
.qshow{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:center}
.qshow .hz{font-size:3rem;line-height:1.1}
.qshow .py{font-size:1.6rem}
.qshow .w{font-size:2rem;font-weight:700;color:var(--navy)}
.qshow .sent{font-size:1.15rem;font-weight:500}
.play{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--jade);color:var(--jade-ink);border-radius:999px;font-weight:600;min-height:52px;padding:0 22px;align-self:flex-start}
.play.en{background:var(--navy);color:var(--surface)}
.play.big{min-height:64px;padding:0 28px;font-size:1.05rem}
.play svg{width:22px;height:22px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opts.letters{display:flex;flex-wrap:wrap;gap:8px}
.opts.letters .opt{min-width:62px;font:700 1.8rem/1 var(--f-py);justify-content:center}
.opt{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:1.05rem}
.opt .py{font-size:1.3rem}
.opt .hz{font-size:1.3rem}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.tone{display:inline-flex;align-items:center;gap:10px}
.tone svg{flex:none}
.qfeed:empty{display:none}
.qfeed{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.qfeed .verdict{font-weight:700}
.qfeed .verdict.ok{color:var(--ok)}
.qfeed .verdict.bad{color:var(--bad)}
.reveal{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.reveal .hz{font-size:2rem}
.reveal .py{font-size:1.2rem}
.result{display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:560px}
.result .score{font:700 3rem/1 var(--f-py);font-variant-numeric:tabular-nums}
.stars{display:flex;gap:4px;color:var(--gold)}
.stars svg{width:28px;height:28px}
.stars .off{color:var(--surface-2)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.games{grid-template-columns:1fr}}
.art{height:84px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:14px;font:700 1.8rem/1 var(--f-py)}
.build{display:flex;flex-direction:column;gap:14px}
.build .slot{display:flex;flex-direction:column;gap:8px}
.build .slot > span{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.build .choices{display:flex;flex-wrap:wrap;gap:8px}
.build .choices button{min-width:64px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:600 1.25rem/1 var(--f-py);padding:0 14px}
.build .choices button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.build .choices button.ok{border-color:var(--ok);background:var(--ok-soft)}
.build .choices button.bad{border-color:var(--bad);background:var(--bad-soft)}
.preview{font:700 2.4rem/1.1 var(--f-py);min-height:2.6rem;color:var(--jade)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:300px;justify-content:center}
.flash .hz{font-size:4rem;line-height:1.1}
.flash .w{font-size:2.2rem;font-weight:700;color:var(--navy)}
.flash .back{display:flex;flex-direction:column;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:14px;width:100%}
.voice-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
/* handwriting practice: a 田字格 practice square */
.hwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.hw{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.hwc{width:150px;height:150px;touch-action:none;border:1px solid var(--line);border-radius:8px;text-align:center;background-image:linear-gradient(var(--surface-2),var(--surface-2)),linear-gradient(var(--surface-2),var(--surface-2));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.hw.big .hwc{width:min(280px,72vw);height:min(280px,72vw)}
.hw .row{justify-content:center;gap:6px}
.hw .row .btn{min-height:42px;padding:0 12px;font-size:.85rem}
.hw .hwmsg{min-height:1.3em;text-align:center}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:transform .08s,background .15s,border-color .15s}}

<script>
/* ========== helpers ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const sample=(a,n)=>shuffle(a).slice(0,n);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=()=>ymd(new Date());
const CJK=/[　-〿一-鿿＀-￯]+/g;
const PYMARK=/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/;
const hzWrap=s=>esc(s).replace(CJK,m=>`<span class="hz">${m}</span>`);

/* ========== pinyin tone logic ========== */
const MARKS={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù','ü':'ǖǘǚǜ'};
const UNMARK={};for(const[v,s]of Object.entries(MARKS))[...s].forEach((c,i)=>UNMARK[c]=[v,i+1]);
function markIndex(s){s=s.toLowerCase();if(s.includes('a'))return s.indexOf('a');if(s.includes('e'))return s.indexOf('e');if(s.includes('ou'))return s.indexOf('o');for(let k=s.length-1;k>=0;k--)if('aeiouü'.includes(s[k]))return k;return -1}
function mark(s,t){if(!t)return s;const i=markIndex(s);if(i<0)return s;return s.slice(0,i)+MARKS[s[i].toLowerCase()][t-1]+s.slice(i+1)}
function parse(syl){let tone=0,base='';for(const ch of syl){if(UNMARK[ch]){base+=UNMARK[ch][0];tone=UNMARK[ch][1]}else base+=ch}return{base,tone}}
function retone(syl,t){const m=syl.match(/^([^A-Za-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]*)(.*?)([^A-Za-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]*)$/);const pre=m[1],core=m[2],post=m[3];if(!core)return syl;const{base}=parse(core);const cap=base[0]!==base[0].toLowerCase();let r=mark(base.toLowerCase(),t);if(cap)r=r[0].toUpperCase()+r.slice(1);return pre+r+post}
const disp=s=>s.replace(/·/g,'');
/* '·' joins syllables inside a word; each syllable is coloured by its tone */
function colorPy(py){return py.split(/([ ·])/).map(p=>{if(p==='·')return'';if(p===' '||!p)return p;return`<span class="t${parse(p).tone}">${esc(p)}</span>`}).join('')}
function contour(t){const L={1:[5,5],2:[3,5],3:[2,1,4],4:[5,1]}[t];const W=40,H=26;const pts=L.map((v,i)=>[4+i*(W-8)/(L.length-1),H-3-(v-1)*(H-6)/4]);return`<svg viewBox="0 0 ${W} ${H}" width="40" height="26" aria-hidden="true"><path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L')}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const TONE_NAME={1:'Thanh 1',2:'Thanh 2',3:'Thanh 3',4:'Thanh 4'};
const toneLabel=t=>`<span class="tone t${t}">${contour(t)}<b>${TONE_NAME[t]}</b></span>`;

/* ========== speech (Chinese + English) ========== */
let zhVoice=null,enVoice=null,voiceReady=false;
function loadVoices(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();if(!vs.length)return;voiceReady=true;
  zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/tingting|ting-ting|xiaoxiao|yunxi|meijia/i.test(v.name))||vs.find(v=>/zh[-_](CN|Hans)/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||vs.find(v=>/^cmn/i.test(v.lang))||null;
  enVoice=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/daniel|kate|serena|arthur|martha|sonia|libby|ryan/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|ava|jenny|aria/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  const el=$('#voiceStatus');if(el)el.innerHTML=voiceText()}
if('speechSynthesis'in window){loadVoices();speechSynthesis.addEventListener?.('voiceschanged',loadVoices)}
function voiceText(){if(!('speechSynthesis'in window))return'Trình duyệt này không có giọng đọc. Hãy mở bằng Safari hoặc Chrome.';if(!voiceReady)return'Đang tìm giọng đọc…';
  const z=zhVoice?`Tiếng Trung: <b>${esc(zhVoice.name)}</b>`:'Chưa có giọng tiếng Trung (iPad: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Trung → tải giọng Tingting).';
  const e=enVoice?`Tiếng Anh: <b>${esc(enVoice.name)}</b>`:'Chưa có giọng tiếng Anh.';return z+'<br>'+e}
function utter(text,lang){const u=new SpeechSynthesisUtterance(lang==='en'?text:disp(text));if(lang==='en'){u.lang=enVoice?enVoice.lang:'en-GB';if(enVoice)u.voice=enVoice;u.rate=Math.min(1,state.rate+0.1)}else{u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=state.rate}return u}
function speak(text,lang){if(!('speechSynthesis'in window)){toast('Thiết bị này chưa đọc được âm thanh');return}try{speechSynthesis.cancel();speechSynthesis.speak(utter(text,lang))}catch(e){}}
function speakQueue(items){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();items.forEach(([t,l])=>speechSynthesis.speak(utter(t,l)))}catch(e){}}

const opt=(html,ok)=>({html,ok:!!ok});
/* a lone lowercase pinyin word (e.g. èrshíwǔ) gets tone colours; Vietnamese/English text stays plain */
function fmt(s){s=String(s);if(PYMARK.test(s)&&/^[a-züāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ']+$/.test(s))return`<span class="py">${colorPy(s)}</span>`;return hzWrap(s)}
const qText=(prompt,right,wrongs,explain,extra={})=>({prompt:hzWrap(prompt),opts:shuffle([opt(fmt(right),1),...wrongs.map(w=>opt(fmt(w)))]),explain:explain?`<p class="small muted">${hzWrap(explain)}</p>`:'',...extra});
function toneItem(){const[b,h,m]=pick(TS);const ts=[1,2,3,4].filter(t=>h[t-1]);const t=pick(ts);return{base:b,t,hz:h[t-1],vi:m[t-1],py:mark(b,t),all:ts}}
function wordVariants(py,n){const parts=py.split(/([ ·])/);const idx=parts.map((p,i)=>(!p||p===' '||p==='·'||!/[a-zü]/i.test(parse(p).base))?-1:i).filter(i=>i>=0);const out=new Set();let g=0;while(out.size<n&&g++<100){const p=parts.slice();const i=pick(idx);const{tone}=parse(p[i]);let t;do{t=Math.random()*5|0}while(t===tone);p[i]=retone(p[i],t);const s=disp(p.join(''));if(s!==disp(py))out.add(s)}return[...out]}
const pyOpt=s=>`<span class="py">${colorPy(s)}</span>`;
const revealZh=(hz,py,vi,key)=>`<div class="reveal">${playZh(hz)}<span class="hz">${esc(hz)}</span><span class="py">${colorPy(py)}</span><span class="muted">${esc(vi||'')}</span>${saveBtn(key||hz)}</div>`;
const revealEn=(w,vi,ex)=>`<div class="reveal">${playEn(w)}<b style="color:var(--navy);font-size:1.15rem">${esc(w)}</b><span class="muted">${esc(vi)}</span>${saveBtn('en:'+w)}</div>${ex?`<p class="small">${esc(ex)}</p>`:''}`;

const Q={

 sylListen(){const it=toneItem();const others=it.all.filter(t=>t!==it.t).map(t=>mark(it.base,t));while(others.length<3){const p=toneItem().py;if(p!==it.py&&!others.includes(p))others.push(p)}return{say:it.hz,prompt:'Nghe và chọn âm tiết đúng',opts:shuffle([opt(pyOpt(it.py),1),...others.slice(0,3).map(p=>opt(pyOpt(p)))]),explain:revealZh(it.hz,it.py,it.vi)}},
 pair(){const[a,b,tip]=pick(PAIRS);const side=Math.random()<.5;const[x,y]=side?[a,b]:[b,a];return{say:x[1],prompt:'Bạn nghe thấy âm nào?',opts:shuffle([opt(pyOpt(x[0]),1),opt(pyOpt(y[0]))]),explain:`${revealZh(x[1],x[0],x[2])}<p class="small muted">${esc(tip)}</p>`}},
 initial(){const[i,g,hz,py,tip]=pick(INI);const same=INI.filter(r=>r[1]===g&&r[0]!==i).map(r=>r[0]);const rest=shuffle(INI.filter(r=>r[0]!==i&&!same.includes(r[0])).map(r=>r[0]));const w=[...shuffle(same),...rest].slice(0,3);return{say:hz,prompt:'Nghe và chọn thanh mẫu (âm đầu)',opts:shuffle([opt(pyOpt(i),1),...w.map(x=>opt(pyOpt(x)))]),explain:`${revealZh(hz,py,'')}<p class="small muted"><b>${esc(i)}</b>: ${esc(tip)}</p>`}},
 final(){const[f,g,hz,py,tip]=pick(FIN);const w=sample(FIN.filter(r=>r[0]!==f).map(r=>r[0]),3);return{say:hz,prompt:'Nghe và chọn vận mẫu (phần vần)',opts:shuffle([opt(pyOpt(f),1),...w.map(x=>opt(pyOpt(x)))]),explain:`${revealZh(hz,py,'')}<p class="small muted"><b>${esc(f)}</b> đọc ${esc(tip)}</p>`}},
 word(){const[hz,py,vi,tip]=pick(WORDS);return{say:hz,prompt:'Nghe rồi chọn cách viết Pinyin đúng',show:`<span class="hz">${esc(hz)}</span><span class="muted">${esc(vi)}</span>`,opts:shuffle([opt(pyOpt(disp(py)),1),...wordVariants(py,3).map(s=>opt(pyOpt(s)))]),explain:`${revealZh(hz,py,vi)}${tip?`<p class="small muted">${esc(tip)}</p>`:''}`}},
 markPlace(){const bases=[...TS.map(r=>r[0]),'liu','dui','xue','lü','gou','jiao','shui','zhuang','niu','mei','kuai','xiong','tou','jiu','gui','lüe'];const b=pick(bases);const t=1+(Math.random()*4|0);const k=markIndex(b);const row=TS.find(r=>r[0]===b);const hz=row&&row[1][t-1];return{prompt:`Đặt dấu ${TONE_NAME[t].toLowerCase()} vào chữ nào?`,show:`<span class="py">${esc(b)}</span><span class="tone t${t}">${contour(t)}<b>${TONE_NAME[t]}</b></span>`,optsClass:'letters',opts:[...b].map((ch,i)=>opt(esc(ch),i===k)),after:hz||null,explain:`<div class="reveal"><span class="py" style="font-size:2rem">${colorPy(mark(b,t))}</span>${hz?`<span class="hz">${hz}</span><span class="muted">${esc(row[2][t-1])}</span>${saveBtn(hz)}`:''}</div><p class="small muted">Quy tắc: có <b>a</b> thì đặt trên a; không có a thì tìm <b>e</b> hoặc <b>o</b>; gặp <b>iu</b> / <b>ui</b> thì đặt trên chữ đứng sau.</p>`}},
 build(){const INIT=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'];let it;do{it=toneItem()}while(/^[yw]/.test(it.base));const ini=INIT.find(i=>it.base.startsWith(i));const fin=it.base.slice(ini.length);const finals=[...new Set(FIN.map(r=>r[0]).filter(f=>f!=='er'))];return{type:'build',say:it.hz,prompt:'Nghe rồi ghép âm tiết: chọn âm đầu, vần và thanh',ans:{ini,fin,t:it.t},choices:{ini:shuffle([ini,...sample(INIT.filter(x=>x!==ini),3)]),fin:shuffle([fin,...sample(finals.filter(x=>x!==fin),3)]),t:[1,2,3,4]},explain:revealZh(it.hz,it.py,it.vi)}}
};
const many=(fn,n)=>Array.from({length:n},()=>fn());
function uniq(fn,n){const out=[],seen=new Set();let g=0;while(out.length<n&&g++<200){const q=fn();const key=(q.say||q.sayEn||'')+q.prompt+(q.show||'');if(!seen.has(key)){seen.add(key);out.push(q)}}return out}
const enPair=(a,b,tip)=>{const side=Math.random()<.5;const[x,y]=side?[a,b]:[b,a];return{sayEn:x,prompt:'Bạn nghe thấy từ nào?',opts:shuffle([opt(`<b>${esc(x)}</b>`,1),opt(`<b>${esc(y)}</b>`)]),explain:`<div class="reveal">${playEn(x)}<b>${esc(x)}</b><span class="muted">·</span>${playEn(y)}<span>${esc(y)}</span></div>${tip?`<p class="small muted">${esc(tip)}</p>`:''}`}};

   ${[[1,'妈','mā','Cao và đều (5-5). Giống thanh ngang nhưng giọng nâng cao, giữ thẳng.'],[2,'麻','má','Đi lên (3-5). Gần thanh sắc, như khi hỏi lại “Hả?”.'],[3,'马','mǎ','Xuống thấp rồi lên (2-1-4). Gần thanh hỏi. Trong câu thường chỉ xuống thấp.'],[4,'骂','mà','Rơi mạnh từ cao (5-1). Dứt khoát, như khi ra lệnh “Đi!”.']].map(([t,h,p,d])=>`<button class="tonecard" data-say="${h}"><span class="tone t${t}">${contour(t)}<b>${TONE_NAME[t]}</b></span><span class="hz">${h}</span><span class="py t${t}">${p}</span><span class="desc">${d}</span></button>`).join('')}
  </div>
  <p>Nghe thêm các bộ bốn thanh:</p>
  <div class="chips">${['ba','tang','shi','tu'].map(b=>{const r=TS.find(x=>x[0]===b);return r[1].map((h,i)=>chip(h,mark(b,i+1),r[2][i])).join('')}).join('')}</div>
  <div class="note"><p>Mẹo: vừa đọc vừa vẽ đường thanh bằng tay trong không khí. Tay đi lên thì giọng đi lên.</p></div>`,
  quiz:()=>many(Q.toneListen,4)},
 {t:'Thanh nhẹ',d:'Âm đọc ngắn, nhẹ, không dấu',
  learn:()=>`
  <p>Thanh nhẹ (<span class="hz">轻声</span>) là âm đọc ngắn và nhẹ, <b>không có dấu</b>. Thường gặp ở chữ lặp lại trong từ gia đình, trợ từ cuối câu và chữ thứ hai trong một số từ quen thuộc.</p>
  <div class="chips">${chip('妈妈','mā·ma','mẹ')}${chip('爸爸','bà·ba','bố')}${chip('谢谢','xiè·xie','cảm ơn')}${chip('朋友','péng·you','bạn bè')}${chip('好吗','hǎo ma','được không?')}${chip('我的','wǒ de','của tôi')}</div>
  <div class="note"><p>Cao độ của thanh nhẹ phụ thuộc vào chữ đứng trước. Chỉ cần đọc thật nhẹ, nhanh, như nói lướt qua.</p></div>`,
  quiz:()=>sample([
   {say:'谢谢',prompt:'Nghe rồi chọn cách viết đúng',opts:shuffle([opt(pyOpt('xièxie'),1),opt(pyOpt('xièxiè')),opt(pyOpt('xiéxie')),opt(pyOpt('xiēxiē'))])},
   {say:'妈妈',prompt:'Nghe rồi chọn cách viết đúng',opts:shuffle([opt(pyOpt('māma'),1),opt(pyOpt('māmā')),opt(pyOpt('máma')),opt(pyOpt('màma'))])},
   {say:'爸爸',prompt:'Nghe rồi chọn cách viết đúng',opts:shuffle([opt(pyOpt('bàba'),1),opt(pyOpt('bāba')),opt(pyOpt('bàbà')),opt(pyOpt('bǎba'))])},
   {say:'朋友',prompt:'Nghe rồi chọn cách viết đúng',opts:shuffle([opt(pyOpt('péngyou'),1),opt(pyOpt('pēngyou')),opt(pyOpt('pèngyōu')),opt(pyOpt('pěngyóu'))])},
   qText('Thanh nhẹ được ghi thế nào?','Không có dấu',['Dấu chấm phía trên','Dấu ngã','Viết in hoa'])

 {t:'Biến điệu',d:'Thanh 3 gặp thanh 3, 不 và 一',
  learn:()=>`
  <p>Khi nói liền, một vài thanh tự đổi cho dễ đọc. Chỉ có 3 quy tắc cần nhớ:</p>
  <ol>
   <li><b>Thanh 3 + thanh 3</b> → chữ đầu đọc thành thanh 2. <span class="py">${colorPy('nǐ hǎo')}</span> đọc là <span class="py">${colorPy('ní hǎo')}</span>.</li>
   <li><b>不 bù</b> + thanh 4 → <span class="py">${colorPy('bú')}</span>. Ví dụ <span class="py">${colorPy('bú shì')}</span> (không phải). Trước thanh 1, 2, 3 giữ <span class="py">${colorPy('bù')}</span>.</li>
   <li><b>一 yī</b> + thanh 4 → <span class="py">${colorPy('yí')}</span> (<span class="py">${colorPy('yí gè')}</span>); + thanh 1, 2, 3 → <span class="py">${colorPy('yì')}</span> (<span class="py">${colorPy('yì tiān')}</span>). Đếm số thì vẫn là <span class="py">${colorPy('yī')}</span>.</li>
  </ol>
  <div class="chips">${chip('你好','ní hǎo','xin chào')}${chip('很好','hén hǎo','rất tốt')}${chip('不是','bú shì','không phải')}${chip('不好','bù hǎo','không tốt')}${chip('一个','yí gè','một cái')}${chip('一天','yì tiān','một ngày')}</div>`,
  quiz:()=>sample([
   {prompt:'<span class="hz">你好</span> (nǐ + hǎo) thực tế đọc là?',opts:shuffle([opt(pyOpt('ní hǎo'),1),opt(pyOpt('nì hǎo')),opt(pyOpt('nǐ háo')),opt(pyOpt('nī hǎo'))])},
   {prompt:'<span class="hz">不是</span> (bù + shì) đọc là?',opts:shuffle([opt(pyOpt('bú shì'),1),opt(pyOpt('bù shì')),opt(pyOpt('bū shì')),opt(pyOpt('bǔ shì'))])},
   {prompt:'<span class="hz">一个</span> (yī + gè) đọc là?',opts:shuffle([opt(pyOpt('yí gè'),1),opt(pyOpt('yī gè')),opt(pyOpt('yì gè')),opt(pyOpt('yǐ gè'))])},
   {prompt:'<span class="hz">一天</span> (yī + tiān) đọc là?',opts:shuffle([opt(pyOpt('yì tiān'),1),opt(pyOpt('yí tiān')),opt(pyOpt('yī tiān')),opt(pyOpt('yǐ tiān'))])},
   {prompt:'<span class="hz">不好</span> (bù + hǎo) đọc là?',opts:shuffle([opt(pyOpt('bù hǎo'),1),opt(pyOpt('bú hǎo')),opt(pyOpt('bū hǎo')),opt(pyOpt('bú háo'))]),explain:'<p class="small muted">Trước thanh 3, 不 giữ nguyên thanh 4.</p>'}
  ],4)},
 {t:'Nghe và nhận diện âm',d:'Nghe trước, đoán sau',
  learn:()=>`
  <p>Khi nghe một âm tiết lạ, hãy tách làm ba bước: <b>thanh</b> đi lên hay xuống? → <b>âm đầu</b> có bật hơi không? → <b>vần</b> mở hay khép?</p>
  <div class="card"><h3>Nghe nhanh</h3><p class="small muted">Bấm “Phát âm ngẫu nhiên”, tự đoán trong đầu rồi bấm “Xem đáp án”.</p><div class="row"><button class="play" data-act="quick">${ICON.play}<span>Phát âm ngẫu nhiên</span></button><button class="btn" data-act="quickShow" id="quickShow" disabled>Xem đáp án</button></div><div id="quickAns"></div></div>
  <div class="chips">${['ji','qi','xi'].map(b=>{const r=TS.find(x=>x[0]===b);return r[1].map((h,i)=>chip(h,mark(b,i+1),r[2][i])).join('')}).join('')}</div>`,
  quiz:()=>uniq(Q.sylListen,4)},
 {t:'Phân biệt âm dễ nhầm',d:'zh/z, j/q/x, -n/-ng, ü/u…',
  learn:()=>`
  <p>Đây là những cặp âm người Việt hay nhầm nhất. Nghe từng cặp, chú ý vị trí lưỡi và môi.</p>
  <div class="pairs">${PAIRS.map(([a,b,tip])=>`<div class="pair"><div class="chips">${chip(a[1],a[0],a[2])}${chip(b[1],b[0],b[2])}</div><p>${esc(tip)}</p></div>`).join('')}</div>`,
  quiz:()=>uniq(Q.pair,4)},
 {t:'Luyện đọc âm tiết',d:'Đọc những từ đầu tiên',
  learn:()=>`
  <p>Giờ bạn đã đọc được Pinyin. Nghe từng từ, đọc theo, và bấm ngôi sao để lưu vào Sổ từ.</p>
  <div class="words">${WORDS.map(([hz,py,vi,tip])=>`<div class="wrow">${playZh(hz)}<span class="hz">${esc(hz)}</span><div class="tx"><span class="py">${colorPy(py)}</span><small>${esc(vi)}${tip?' · '+esc(tip):''}</small></div>${saveBtn(hz)}</div>`).join('')}</div>`,
  quiz:()=>uniq(Q.word,4)}
];

const EN_SHORT=[['ship','sheep','/ɪ/ ngắn, thả lỏng · /iː/ dài, miệng cười'],['live','leave','/ɪ/ – /iː/'],['sit','seat','/ɪ/ – /iː/'],['full','fool','/ʊ/ ngắn · /uː/ dài, môi tròn'],['pull','pool','/ʊ/ – /uː/'],['bad','bed','/æ/ mở to miệng · /e/ như “e” tiếng Việt'],['man','men','/æ/ – /e/'],['cut','cart','/ʌ/ ngắn như “ă” · /ɑː/ dài như “a” kéo'],['hut','heart','/ʌ/ – /ɑː/']];
const EN_END=[['bag','back','/g/ có rung · /k/ bật nhẹ, không rung'],['card','cart','/d/ – /t/'],['price','prize','/s/ không rung · /z/ rung như ong kêu'],['rice','rise','/s/ – /z/'],['cap','cab','/p/ – /b/'],['white','wide','/t/ – /d/']];

const ENP=[
 {t:'Bảng phiên âm IPA',d:'Đọc phiên âm trong từ điển',
  learn:()=>`
  <p>Tiếng Anh viết một đằng đọc một nẻo. <b>IPA</b> (bảng phiên âm quốc tế) ghi đúng cách đọc của từng từ, giống vai trò của Pinyin với tiếng Trung. Tiếng Anh có <b>44 âm</b>: 20 nguyên âm và 24 phụ âm.</p>
  <p>Bấm để nghe những từ người học hay đọc sai vì nhìn chữ:</p>
  <div class="chips">${enChip('receipt','/rɪˈsiːt/','biên lai · p câm')}${enChip('debt','/det/','khoản nợ · b câm')}${enChip('Wednesday','/ˈwenzdeɪ/','thứ Tư')}${enChip('island','/ˈaɪlənd/','hòn đảo · s câm')}${enChip('comfortable','/ˈkʌmftəbl/','thoải mái')}</div>
  <div class="note"><h3>Hai ký hiệu cần biết</h3><ul><li><b>ˈ</b> đặt trước âm tiết được nhấn: /rɪˈ<b>siːt</b>/.</li><li><b>ː</b> nghĩa là kéo dài âm: /siː/ dài hơn /sɪ/.</li></ul></div>
  <div class="note warn"><p>Mẹo: tra từ trên Cambridge Dictionary, bấm loa <b>UK</b> để nghe giọng Anh, hay dùng trong IELTS.</p></div>`,
  quiz:()=>sample([
   qText('Chữ nào không đọc trong “receipt”?','p',['c','t','e']),
   qText('“debt” đọc là?','/det/',['/debt/','/diːbt/','/dept/']),
   qText('Dấu ː trong /siː/ nghĩa là?','Kéo dài âm',['Nhấn trọng âm','Âm câm','Lên giọng']),
   {sayEn:'Wednesday',prompt:'Nghe và chọn từ đúng',opts:shuffle([opt('<b>Wednesday</b>',1),opt('<b>wedding</b>'),opt('<b>weekday</b>'),opt('<b>windy</b>')])},
   qText('IPA giống vai trò của gì trong tiếng Trung?','Pinyin',['Chữ Hán','Bộ thủ','Lượng từ'])
  ],4)},
 {t:'Nguyên âm ngắn và dài',d:'ship – sheep, full – fool',
  learn:()=>`
  <p>Tiếng Việt không phân biệt âm ngắn và dài, nhưng tiếng Anh thì có, và đổi nghĩa luôn: <b>ship</b> (tàu) khác <b>sheep</b> (cừu). Nghe từng cặp:</p>
  <div class="pairs">${EN_SHORT.slice(0,9).map(([a,b,tip])=>`<div class="pair"><div class="chips">${enChip(a)}${enChip(b)}</div><p>${esc(tip)}</p></div>`).join('')}</div>`,
  quiz:()=>sample(EN_SHORT,4).map(([a,b,t])=>enPair(a,b,t))},
 {t:'Nguyên âm đôi',d:'day, my, boy, now, go',
  learn:()=>`
  <p>Nguyên âm đôi là hai âm trượt vào nhau. Nhiều âm rất gần vần tiếng Việt nên dễ học:</p>
  <div class="sound">${[['/eɪ/','day','gần “ây”'],['/aɪ/','my','gần “ai”'],['/ɔɪ/','boy','gần “oi”'],['/aʊ/','now','gần “ao”'],['/əʊ/','go','gần “âu”, giọng Anh'],['/ɪə/','here','gần “ia”'],['/eə/','hair','“e” trượt sang “ơ”'],['/ʊə/','tour','gần “ua”']].map(([i,w,t])=>sndEn(i,w,t)).join('')}</div>
  <div class="note"><p>Lỗi hay gặp: đọc <b>name</b> thành “nem”. Hãy trượt hết sang /ɪ/: <b>/neɪm/</b> “nây-m”.</p></div>`,
  quiz:()=>sample([
   qText('Từ nào có âm giống “day” /eɪ/?','rain',['ran','rim','run']),
   qText('Từ nào có âm giống “my” /aɪ/?','fine',['fin','fan','fun']),
   qText('Từ nào có âm giống “go” /əʊ/?','phone',['fun','fan','fin']),
   qText('Từ nào có âm giống “now” /aʊ/?','house',['horse','his','has']),
   qText('Từ nào có âm giống “boy” /ɔɪ/?','coin',['cone','can','kin'])
  ],4)},
 {t:'Âm cuối',d:'Đừng nuốt âm cuối',
  learn:()=>`
  <p>Người Việt hay bỏ hoặc nuốt âm cuối, nhưng trong tiếng Anh âm cuối mang nghĩa: <b>card</b> (thẻ) khác <b>cart</b> (xe đẩy), <b>price</b> (giá) khác <b>prize</b> (giải thưởng).</p>
  <div class="pairs">${EN_END.map(([a,b,tip])=>`<div class="pair"><div class="chips">${enChip(a)}${enChip(b)}</div><p>${esc(tip)}</p></div>`).join('')}</div>
  <div class="note"><p>Đặc biệt nhớ đọc <b>-s</b> ở số nhiều: <b>invoices, receipts, documents</b>. Thiếu -s là sai ngữ pháp khi nói.</p></div>`,
  quiz:()=>sample(EN_END,4).map(([a,b,t])=>enPair(a,b,t))},
 {t:'Phụ âm khó',d:'/θ/ /ð/ /ʃ/ /tʃ/ /dʒ/ /v/',
  learn:()=>`
  <p>Đây là những phụ âm tiếng Việt không có. Thú vị là chữ <b>“th”</b> tiếng Việt lại gần với <b>t</b> của Pinyin (bật hơi), còn <b>th</b> tiếng Anh /θ/ là một âm hoàn toàn khác.</p>
  <div class="pairs">${EN_CONS.map(([a,b,tip])=>`<div class="pair"><div class="chips">${enChip(a)}${enChip(b)}</div><p>${esc(tip)}</p></div>`).join('')}</div>`,
  quiz:()=>sample(EN_CONS,4).map(([a,b,t])=>enPair(a,b,t))},
 {t:'Đuôi -s và -ed',d:'/s/ /z/ /ɪz/ · /t/ /d/ /ɪd/',
  learn:()=>`
  <div class="group"><h3>Đuôi -s / -es</h3><div class="chips">${enChip('works','/s/','sau âm không rung')}${enChip('checks','/s/')}${enChip('plays','/z/','sau âm rung')}${enChip('bags','/z/')}${enChip('watches','/ɪz/','sau s, z, ʃ, tʃ, dʒ')}${enChip('invoices','/ɪz/')}</div></div>
  <div class="group"><h3>Đuôi -ed</h3><div class="chips">${enChip('worked','/t/','sau âm không rung')}${enChip('finished','/t/')}${enChip('played','/d/','sau âm rung')}${enChip('approved','/d/')}${enChip('wanted','/ɪd/','sau t, d')}${enChip('needed','/ɪd/')}</div></div>
  <div class="note"><p>Chỉ thêm một âm tiết khi gặp /ɪz/ hoặc /ɪd/. <b>worked</b> đọc 1 âm tiết “wơkt”, không phải “wơ-kết”.</p></div>`,
  quiz:()=>sample([
   qText('Đuôi -s trong “invoices” đọc là?','/ɪz/',['/s/','/z/']),
   qText('Đuôi -s trong “plays” đọc là?','/z/',['/s/','/ɪz/']),
   qText('Đuôi -s trong “works” đọc là?','/s/',['/z/','/ɪz/']),
   qText('Đuôi -ed trong “wanted” đọc là?','/ɪd/',['/t/','/d/']),
   qText('Đuôi -ed trong “checked” đọc là?','/t/',['/d/','/ɪd/']),
   qText('Đuôi -ed trong “approved” đọc là?','/d/',['/t/','/ɪd/'])
  ],4)},
 {t:'Trọng âm từ',d:'PHOto · phoTOgraphy',
  learn:()=>`
  <p>Mỗi từ nhiều âm tiết có một âm tiết đọc <b>to, dài, cao</b> hơn. Đặt sai trọng âm thì người nghe khó hiểu dù phát âm từng âm đúng. Giống thanh điệu tiếng Trung, đây là “nhạc” của từ.</p>
  <div class="chips">${enChip('PHOtograph','','ảnh')}${enChip('phoTOgraphy','','nhiếp ảnh')}${enChip('acCOUNtant','','kế toán viên')}${enChip('INvoice','','hóa đơn')}${enChip('inforMAtion','','thông tin')}${enChip('reconciliAtion','','đối chiếu')}</div>
  <div class="note"><h3>Ba quy tắc hay dùng</h3><ul><li>Danh từ, tính từ 2 âm tiết thường nhấn âm đầu: <b>TA</b>ble, <b>HAP</b>py.</li><li>Động từ 2 âm tiết thường nhấn âm sau: de<b>CIDE</b>, be<b>GIN</b>.</li><li>Từ đuôi <b>-tion, -ic</b>: nhấn ngay trước đuôi: infor<b>MA</b>tion, eco<b>NO</b>mic.</li></ul></div>`,
  quiz:()=>sample([['accountant','ac-COUN-tant',['AC-coun-tant','ac-coun-TANT']],['invoice','IN-voice',['in-VOICE']],['information','in-for-MA-tion',['IN-for-ma-tion','in-FOR-ma-tion']],['develop','de-VE-lop',['DE-ve-lop','de-ve-LOP']],['economic','e-co-NO-mic',['E-co-no-mic','e-CO-no-mic']],['decide','de-CIDE',['DE-cide']],['important','im-POR-tant',['IM-por-tant','im-por-TANT']],['photography','pho-TO-gra-phy',['PHO-to-gra-phy','pho-to-GRA-phy']]],4).map(([w,r,ws])=>({sayEn:w,prompt:`Trọng âm của <b>${w}</b> rơi vào đâu?`,opts:shuffle([opt(`<b>${r}</b>`,1),...ws.map(x=>opt(`<b>${x}</b>`))]),explain:`<div class="reveal">${playEn(w)}<b>${r}</b></div>`}))},
 {t:'Âm /ə/ và dạng yếu',d:'about, to, for, can',
  learn:()=>`
  <p><b>/ə/</b> (schwa) là âm phổ biến nhất tiếng Anh: một âm “ơ” rất ngắn, nhẹ, ở những âm tiết không nhấn: <b>a</b>bout, banan<b>a</b>, teach<b>er</b>.</p>
  <p>Các từ nhỏ như <b>to, for, can, and, of</b> trong câu thường đọc yếu với /ə/. Đọc đủ từng từ nghe rất “cứng”.</p>
  <div class="chips">${enChip('about','/əˈbaʊt/')}${enChip('I want to go','to = /tə/')}${enChip('Can you help me?','can = /kən/')}${enChip('fish and chips','and = /ən/')}${enChip('a cup of tea','of = /əv/')}</div>`,
  quiz:()=>sample([
   qText('Trong “I want to go”, “to” đọc là?','/tə/',['/tuː/','/tɔː/']),

/* Hanzi Writer: animated stroke order + finger tracing */
const WRITERS=new WeakMap();
function mountHW(root){if(!root)return;root.querySelectorAll('.hw:not([data-ready])').forEach(el=>{el.dataset.ready='1';const ch=el.dataset.hw;const box=el.querySelector('.hwc');
  if(!window.HanziWriter||!HWD[ch]){box.innerHTML=`<span class="hz" style="font-size:5rem;line-height:150px">${esc(ch)}</span>`;el.querySelector('.row').hidden=true;return}
  const cs=getComputedStyle(document.documentElement);const c=n=>cs.getPropertyValue(n).trim();const size=box.clientWidth||150;
  try{const w=HanziWriter.create(box,ch,{width:size,height:size,padding:10,showOutline:true,strokeColor:c('--ink'),outlineColor:c('--line'),radicalColor:c('--seal'),drawingColor:c('--jade'),highlightColor:c('--gold'),drawingWidth:Math.round(size/9),strokeAnimationSpeed:1,delayBetweenStrokes:300,showHintAfterMisses:2,charDataLoader:(x,ok)=>ok(HWD[x])});WRITERS.set(el,w)}catch(e){box.innerHTML=`<span class="hz" style="font-size:5rem;line-height:150px">${esc(ch)}</span>`}})}

/* ========== the path: one bilingual sequence of days ========== */
const PART={A:{t:'Từ mới',min:12},B:{t:'Mẫu câu & ngữ pháp',min:15},C:{t:'Hội thoại & nói',min:15}};
const DAYS=[];
ZHP.forEach((z,k)=>DAYS.push({phase:1,k,zh:z.t,en:ENP[k].t,min:12}));
UNITS.forEach((u,ui)=>['A','B','C'].forEach(p=>DAYS.push({phase:2,ui,p,zh:p==='A'?'Từ mới chủ đề':p==='B'?u.zp.map(x=>x.t.split(':')[0]).slice(0,2).join(' · '):'Hội thoại',en:p==='A'?'Vocabulary':p==='B'?u.eg.t.split(':')[0]:'Speaking Part 1',min:PART[p].min})));
ZH3.forEach((z,k)=>DAYS.push({phase:3,k,zh:z.t,en:EN3[k].t,min:15}));
const PHASES={1:'Nền âm thanh',2:'Giao tiếp theo chủ đề',3:'Chữ Hán & cấu tạo từ'};
const dayTitle=d=>d.phase===1?`Nền âm thanh ${d.k+1}`:d.phase===3?`Chữ Hán & cấu tạo từ ${d.k+1}`:`${UNITS[d.ui].vi} · ${PART[d.p].t}`;

/* ========== flashcard index (review deck) ========== */
const CARD={};const IDX={};
UNITS.forEach(u=>{u.zw.forEach(w=>{CARD['zw:'+w[0]]={lang:'zh',hz:w[0],py:w[1],vi:w[2],en:w[3],ex:w[4],exPy:w[5],exVi:w[6]};IDX[w[0]]={hz:w[0],py:w[1],vi:w[2]}});
  u.ew.forEach(w=>{CARD['ew:'+w[0]]={lang:'en',w:w[0],vi:w[1],ex:w[2],note:w[3]}});
  u.zp.forEach(p=>{const e=p.ex[0];CARD['zs:'+e[0]]={lang:'zh',hz:e[0],py:e[1],vi:e[2],sent:true}})});
TS.forEach(([b,h,m])=>h.forEach((z,i)=>{if(z&&!IDX[z])IDX[z]={hz:z,py:mark(b,i+1),vi:m[i]}}));
PAIRS.forEach(([a,b])=>[a,b].forEach(([p,z,v])=>{if(!IDX[z])IDX[z]={hz:z,py:p,vi:v}}));
WORDS.forEach(([z,p,v])=>{IDX[z]={hz:z,py:p,vi:v}});
const ENIDX={};UNITS.forEach(u=>u.ew.forEach(w=>ENIDX[w[0]]={w:w[0],vi:w[1],ex:w[2]}));
PICTO.forEach(p=>{CARD['pg:'+p[0]]={lang:'zh',hz:p[0],py:p[1],vi:`${p[2]} (Hán Việt: ${p[3]})`};if(!IDX[p[0]])IDX[p[0]]={hz:p[0],py:p[1],vi:p[2]}});
RADS.forEach(r=>{CARD['rad:'+r[0]]={lang:'zh',hz:r[0],py:r[2],vi:`${r[3]}: ${r[4]}`,say:r[1],en:r[1]};r[5].forEach(e=>{if(!IDX[e[0]])IDX[e[0]]={hz:e[0],py:e[1],vi:e[2]}})});
HOIY.forEach(h=>{CARD['hy:'+h[0]]={lang:'zh',hz:h[0],py:h[1],vi:`${h[2]} (${h[4]})`};if(!IDX[h[0]])IDX[h[0]]={hz:h[0],py:h[1],vi:h[2]}});
EN3.forEach(e=>e.words.forEach(([w,vi,ex])=>{CARD['ew:'+w]={lang:'en',w,vi,ex};ENIDX[w]={w,vi,ex}}));

/* ========== state & sync ========== */
const LS='lingua-garden.v2';
function norm(s){try{s=JSON.parse(JSON.stringify(s||{}))}catch(e){s={}}if(!s||typeof s!=='object')s={};const o=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};return{done:o(s.done),games:o(s.games),srs:o(s.srs),saved:Array.isArray(s.saved)?s.saved.filter(x=>typeof x==='string'):[],days:Array.isArray(s.days)?s.days.filter(x=>typeof x==='string'):[],rate:typeof s.rate==='number'?s.rate:0.8}}
function loadLocal(){try{const v2=localStorage.getItem(LS);if(v2)return norm(JSON.parse(v2));const v1=JSON.parse(localStorage.getItem('lingua-garden.v1')||'null');if(v1)return norm({saved:v1.saved,days:v1.days,games:v1.games,rate:v1.rate})}catch(e){}return norm(null)}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function merge(a,b){const o=norm(a);for(const k in b.done){const x=o.done[k]||{},y=b.done[k]||{};o.done[k]={done:!!(x.done||y.done),best:Math.max(x.best||0,y.best||0)}}for(const k in b.games){const x=o.games[k]||{},y=b.games[k]||{};o.games[k]={best:Math.max(x.best||0,y.best||0),plays:Math.max(x.plays||0,y.plays||0)}}for(const k in b.srs){const x=o.srs[k],y=b.srs[k];if(!x||(y&&(y.d||'')>(x.d||'')))o.srs[k]=y}o.saved=[...new Set([...o.saved,...b.saved])];o.days=[...new Set([...o.days,...b.days])].sort();return o}
let state=loadLocal();
const cloud={ref:null,timer:null,chain:Promise.resolve()};
function setSync(s){const el=$('#sync');if(!el)return;el.dataset.s=s;el.querySelector('span').textContent={cloud:'Đã đồng bộ',loading:'Đang đồng bộ…',local:'Lưu trên máy này',retry:'Chưa đồng bộ được'}[s]||''}
function save(){saveLocal();pushCloud();updateBadge()}
function pushCloud(){if(!cloud.ref)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(state));setSync('loading');cloud.chain=cloud.chain.then(()=>cloud.ref.set(body)).then(()=>setSync('cloud')).catch(e=>setSync(e&&e.code==='invalid_argument'?'local':'retry'))},1200)}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
    cloud.ref=db.doc('data/users/'+id+'/progress-v2');setSync('loading');
    const snap=await Promise.race([cloud.ref.get(),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000))]);
    if(snap.exists){const remote=norm(snap.data());const merged=merge(state,remote);const changed=JSON.stringify(merged)!==JSON.stringify(merge(remote,remote));state=merged;saveLocal();if(!QUIZ&&!PLAYER)render();if(changed)pushCloud();else setSync('cloud')}else pushCloud()
  }catch(e){setSync(cloud.ref?'retry':'local')}}
function recordDay(){const t=TODAY();if(!state.days.includes(t)){state.days.push(t);state.days.sort()}}
function streak(){const set=new Set(state.days);const d=new Date();if(!set.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
const INT=[1,2,4,7,15,30];
function addCards(ids){ids.forEach(id=>{if(CARD[id]&&!state.srs[id])state.srs[id]={b:0,d:addDays(1)}})}
const dueIds=()=>{const t=TODAY();return Object.keys(state.srs).filter(id=>CARD[id]&&(state.srs[id].d||'')<=t)};
function updateBadge(){const b=$('#dueBadge');if(!b)return;const n=dueIds().length;b.hidden=!n;b.textContent=n}

/* ========== progress helpers ========== */
const isDone=n=>!!(state.done[n]&&state.done[n].done);
const unlocked=n=>n===0||isDone(n-1);
const doneCount=()=>DAYS.filter((_,i)=>isDone(i)).length;
const nextDay=()=>{for(let n=0;n<DAYS.length;n++)if(!isDone(n))return n;return null};
function plant(n,total){const lv=Math.round(n/total*10);const h=14+lv*7;let leaves='';for(let k=0;k<Math.min(lv,9);k++){const y=100-12-k*7;const s=k%2?1:-1;leaves+=`<path d="M60 ${y} q ${s*14} -11 ${s*24} -3 q ${-s*11} 9 ${-s*24} 3z" fill="var(--jade)" opacity="${.55+k*.05}"/>`}const flower=lv>=10?`<g transform="translate(60 ${100-h})">${[0,72,144,216,288].map(a=>`<ellipse rx="5" ry="9" transform="rotate(${a}) translate(0 -8)" fill="var(--seal)"/>`).join('')}<circle r="5" fill="var(--gold)"/></g>`:`<circle cx="60" cy="${100-h}" r="3.5" fill="var(--jade)"/>`;return`<svg class="plant" viewBox="0 0 120 110" aria-hidden="true"><path d="M28 101h64" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/><path d="M60 100V${100-h}" stroke="var(--jade)" stroke-width="3" stroke-linecap="round"/>${leaves}${flower}</svg>`}

/* ========== lesson steps ========== */
const wordCardZh=w=>`<div class="wcard"><button class="hzbig" data-say="${esc(w[0])}">${esc(w[0])}</button><div class="pybig">${colorPy(w[1])}</div><div class="mean"><b>${esc(w[2])}</b> · <span class="muted">${esc(w[3])}</span></div><div class="ex">${playZh(w[4])}<div class="tx"><span class="hz">${esc(w[4])}</span><span class="py">${colorPy(w[5])}</span><span class="muted small">${esc(w[6])}</span></div></div>${saveBtn(w[0])}</div>`;
const wordCardEn=w=>`<div class="wcard"><button class="wbig" data-say-en="${esc(w[0])}">${esc(w[0])}</button><div class="mean"><b>${esc(w[1])}</b></div>${w[3]?`<p class="small muted">${esc(w[3])}</p>`:''}<div class="ex">${playEn(w[2])}<div class="tx"><span>${esc(w[2])}</span></div></div>${saveBtn('en:'+w[0])}</div>`;
const exRowsZh=ex=>`<div class="exlist">${ex.map(e=>`<div class="exrow">${playZh(e[0])}<div class="tx"><span class="hz">${esc(e[0])}</span><span class="py">${colorPy(e[1])}</span><span class="small muted">${esc(e[2])}</span></div></div>`).join('')}</div>`;
const exRowsEn=ex=>`<div class="exlist">${ex.map(e=>`<div class="exrow">${playEn(e[0])}<div class="tx"><span class="en">${esc(e[0])}</span><span class="small muted">${esc(e[1])}</span></div></div>`).join('')}</div>`;
function unitQuizVocab(u,nz,ne){const zw=u.zw,ew=u.ew;const qs=[];
  sample(zw,nz).forEach((w,i)=>{if(i%2===0)qs.push({say:w[0],prompt:'Nghe và chọn nghĩa',show:`<span class="hz">${esc(w[0])}</span>`,opts:shuffle([opt(esc(w[2]),1),...sample(zw.filter(x=>x!==w),3).map(x=>opt(esc(x[2])))]),explain:revealZh(w[0],w[1],w[2])});
    else qs.push({prompt:'Chọn Pinyin đúng',show:`<span class="hz">${esc(w[0])}</span><span class="muted">${esc(w[2])}</span>`,opts:shuffle([opt(pyOpt(disp(w[1])),1),...wordVariants(w[1],3).map(s=>opt(pyOpt(s)))]),after:w[0],explain:revealZh(w[0],w[1],w[2])})});
  sample(ew,ne).forEach((w,i)=>{const re=new RegExp(w[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');if(i%2===1&&re.test(w[2]))qs.push({prompt:'Chọn từ phù hợp điền vào chỗ trống',show:`<span class="sent">${esc(w[2].replace(re,'_____'))}</span>`,opts:shuffle([opt(`<b>${esc(w[0])}</b>`,1),...sample(ew.filter(x=>x!==w),3).map(x=>opt(`<b>${esc(x[0])}</b>`))]),explain:revealEn(w[0],w[1],w[2])});
    else qs.push({sayEn:w[0],prompt:'Từ này nghĩa là gì?',show:`<span class="w">${esc(w[0])}</span>`,opts:shuffle([opt(esc(w[1]),1),...sample(ew.filter(x=>x!==w),3).map(x=>opt(esc(x[1])))]),explain:revealEn(w[0],w[1],w[2])})});
  return qs}
const authored=(rows,n)=>sample(rows,n).map(r=>qText(r[0],r[1],r[2],r[3]));
function buildSteps(n){const d=DAYS[n];const S=[];
  S.push({kind:'goal'});
  if(d.phase===1){const z=ZHP[d.k],e=ENP[d.k];
    S.push({lang:'zh',title:z.t,html:()=>`<div class="prose">${z.learn()}</div>`});
    S.push({lang:'zh',title:'Luyện tập',quiz:()=>z.quiz()});
    S.push({lang:'en',title:e.t,html:()=>`<div class="prose">${e.learn()}</div>`});
    S.push({lang:'en',title:'Luyện tập',quiz:()=>e.quiz()});}
  else if(d.phase===3){const z=ZH3[d.k],e=EN3[d.k];
    S.push({lang:'zh',title:z.t,html:()=>`<div class="prose">${z.learn()}</div>`});
    if(z.write)S.push({lang:'zh',title:'Tập viết bằng tay',html:()=>writeHtml(z.write)});
    S.push({lang:'zh',title:'Luyện tập',quiz:()=>z.quiz()});
    S.push({lang:'en',title:e.t,html:()=>`<div class="prose">${e.learn()}</div>`});
    S.push({lang:'en',title:'Luyện tập',quiz:()=>e.quiz()});
    S.cards=[...(z.cards||[]),...e.words.map(w=>'ew:'+w[0])];}
  else{const u=UNITS[d.ui];
    if(d.p==='A'){u.zw.forEach((w,i)=>S.push({lang:'zh',title:`Từ mới ${i+1}/${u.zw.length}`,say:w[0],html:()=>wordCardZh(w)}));
      u.ew.forEach((w,i)=>S.push({lang:'en',title:`Vocabulary ${i+1}/${u.ew.length}`,sayEn:w[0],html:()=>wordCardEn(w)}));
      S.push({lang:'mix',title:'Luyện tập',quiz:()=>shuffle(unitQuizVocab(u,4,4))});
      S.cards=[...u.zw.map(w=>'zw:'+w[0]),...u.ew.map(w=>'ew:'+w[0])];}
    if(d.p==='B'){u.zp.forEach(p=>S.push({lang:'zh',title:p.t,html:()=>`<div class="fbox">${hzWrap(p.f)}</div><p>${hzWrap(p.n)}</p>${exRowsZh(p.ex)}`}));
      S.push({lang:'en',title:u.eg.t,html:()=>`<div class="prose">${u.eg.note}</div>${exRowsEn(u.eg.ex)}`});
      S.push({lang:'en',title:'Lỗi người Việt hay mắc',html:()=>`<div class="mistakes">${u.eg.mis.map(m=>`<div class="mis"><span class="x">✗ ${esc(m[0])}</span><span class="v">✓ ${esc(m[1])}</span><span class="small muted">${esc(m[2])}</span></div>`).join('')}</div>`});
      S.push({lang:'mix',title:'Luyện tập',quiz:()=>shuffle([...authored(u.zq,4),...authored(u.eq,4)])});
      S.cards=u.zp.map(p=>'zs:'+p.ex[0][0]);}
    if(d.p==='C'){S.push({lang:'zh',title:'Hội thoại',html:()=>dialogueHtml(u)});
      S.push({lang:'zh',title:'Nói theo (shadowing)',html:()=>`<p>Nghe từng câu rồi nói theo ngay, cố bắt chước cả thanh điệu. Mỗi câu nói 3 lần.</p><div class="exlist">${u.dl.map(l=>`<div class="exrow">${playZh(l[1])}<div class="tx"><span class="hz">${esc(l[1])}</span><span class="py">${colorPy(l[2])}</span></div></div>`).join('')}</div><div class="note"><p>Mẹo: nói nhỏ cũng được, quan trọng là mở miệng. Lần thứ ba thử không nhìn Pinyin.</p></div>`});
      u.sp.forEach((s,i)=>S.push({lang:'en',title:`Speaking ${i+1}/${u.sp.length}`,sayEn:s.q,html:()=>speakHtml(s,i)}));
      S.push({lang:'mix',title:'Ôn tập cả chủ đề',quiz:()=>shuffle([...unitQuizVocab(u,2,2),...authored(u.zq,2),...authored(u.eq,2)])});}
  }
  S.push({kind:'summary'});return S}
function dialogueHtml(u){return`<div class="row"><button class="play" data-act="playDialog" data-u="${UNITS.indexOf(u)}">${ICON.play}<span>Nghe cả đoạn</span></button><div class="seg" role="group" aria-label="Hiển thị"><button data-act="toggleDl" data-c="hide-py" aria-pressed="false">Ẩn Pinyin</button><button data-act="toggleDl" data-c="hide-vi" aria-pressed="false">Ẩn nghĩa</button></div></div><div class="dlg" id="dlg">${u.dl.map(l=>`<div class="dl"><span class="who">${esc(l[0])}</span>${playZh(l[1])}<div class="tx"><span class="hz">${esc(l[1])}</span><span class="py">${colorPy(l[2])}</span><span class="small muted vi">${esc(l[3])}</span></div></div>`).join('')}</div>`}
function speakHtml(s,i){return`<p class="eyebrow">IELTS Speaking · Part 1</p><div class="row"><button class="play en big" data-say-en="${esc(s.q)}">${ICON.play}<span>${esc(s.q)}</span></button></div>
  <div class="card"><p><b>Bước 1.</b> Tự trả lời thành tiếng trong 30–45 giây. Đừng lo sai, cứ nói.</p><div class="row"><span class="timer" id="tmr">0:45</span><button class="btn" data-act="timer">Bắt đầu đếm giờ</button></div></div>
  <div class="card"><p><b>Bước 2.</b> Xem câu trả lời mẫu, nghe và nói theo.</p><button class="btn" data-act="showSample" data-i="${i}">Xem câu trả lời mẫu</button><div id="sample${i}" hidden><div class="sample"><div class="row">${playEn(s.a)}<span class="small muted">Câu trả lời mẫu (band 6.5–7). Hãy thay bằng thông tin của bạn.</span></div><p>${esc(s.a)}</p><div class="chips">${s.ph.map(p=>enChip(p)).join('')}</div></div></div></div>`}

/* ========== player ========== */
let PLAYER=null;
function viewDay(n){const d=DAYS[n];if(!d)return viewPath();
  if(!unlocked(n)){PLAYER=null;return`<div class="card"><p class="eyebrow">Ngày ${n+1}</p><h2>${esc(dayTitle(d))}</h2><p class="muted">Ngày này mở khi bạn hoàn thành Ngày ${n}.</p><div class="row"><button class="btn primary" data-act="go" data-to="day-${n-1}">Đến Ngày ${n}</button></div></div>`}
  PLAYER={n,steps:buildSteps(n),i:0,res:{},finished:false};return`<div class="player" id="player"></div>`}
function renderStep(){const P=PLAYER;if(!P)return;const st=P.steps[P.i],d=DAYS[P.n];QUIZ=null;
  const pct=Math.round(P.i/(P.steps.length-1)*100);let body='',foot=true;
  if(st.kind==='goal'){const items=d.phase===1?[[LZH,ZHP[d.k].t,ZHP[d.k].d],[LEN,ENP[d.k].t,ENP[d.k].d]]:d.phase===3?[[LZH,ZH3[d.k].t,ZH3[d.k].d],...(ZH3[d.k].write?[[LZH,'Tập viết bằng tay',ZH3[d.k].write.join(' ')]]:[]),[LEN,EN3[d.k].t,EN3[d.k].d],[LMIX,'Luyện tập 2 phần','']]:d.p==='A'?[[LZH,`${UNITS[d.ui].zw.length} từ mới`,UNITS[d.ui].zw.map(w=>w[0]).join(' · ')],[LEN,`${UNITS[d.ui].ew.length} từ / cụm từ`,UNITS[d.ui].ew.slice(0,4).map(w=>w[0]).join(', ')+'…'],[LMIX,'Luyện tập 8 câu','']]:d.p==='B'?[[LZH,'Mẫu câu',UNITS[d.ui].zp.map(p=>p.t).join(' · ')],[LEN,'Ngữ pháp',UNITS[d.ui].eg.t],[LMIX,'Luyện tập 8 câu','']]:[[LZH,'Hội thoại + nói theo',`${UNITS[d.ui].dl.length} câu`],[LEN,'IELTS Speaking Part 1',UNITS[d.ui].sp.map(s=>s.q).join(' / ')],[LMIX,'Ôn tập cả chủ đề','8 câu']];
    body=`<div class="pstep-head"><p class="eyebrow">Ngày ${P.n+1}/${DAYS.length} · Giai đoạn ${d.phase} · ${PHASES[d.phase]}</p><h1>${esc(dayTitle(d))}</h1><p class="sub">Khoảng ${d.min} phút. Hôm nay bạn sẽ:</p></div><ul class="goal-list">${items.map(([b,t,s])=>`<li>${b}<div><b>${esc(t)}</b>${s?`<p class="small muted">${hzWrap(s)}</p>`:''}</div></li>`).join('')}</ul><div class="note"><p>Đi lần lượt từng bước. Bấm vào chữ hoặc nút loa để nghe. Cuối bài làm đúng từ 60% là mở ngày tiếp theo.</p></div>`}
  else if(st.kind==='summary'){foot=false;body=summaryHtml()}
  else{const badge=st.lang==='zh'?LZH:st.lang==='en'?LEN:LMIX;body=`<div class="pstep-head"><div class="row">${badge}</div><h2>${hzWrap(st.title)}</h2></div>`+(st.quiz?`<div id="pquiz"></div>`:st.html());if(st.quiz)foot='quiz'}
  $('#player').innerHTML=`<div class="phead"><button class="pclose" data-act="go" data-to="path" aria-label="Thoát bài">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="pcount">${P.i+1}/${P.steps.length}</span></div><div class="pbody">${body}</div>${foot?`<div class="pfoot"><button class="btn ghost" data-act="pback" ${P.i===0?'disabled':''}>← Quay lại</button>${foot==='quiz'?'<span class="small muted" style="align-self:center">Trả lời hết để đi tiếp</span>':`<button class="btn primary" data-act="pnext">${P.i===0?'Bắt đầu học':'Tiếp →'}</button>`}</div>`:''}`;
  window.scrollTo(0,0);mountHW($('#player'));
  if(st.quiz){const i=P.i;startQuiz($('#pquiz'),st.quiz(),(s,t)=>{P.res[i]={s,t};pnext()})}
  else if(st.say)speak(st.say,'zh');else if(st.sayEn)speak(st.sayEn,'en')}
function pnext(){const P=PLAYER;if(!P)return;if(P.i<P.steps.length-1){P.i++;renderStep()}}
function pback(){const P=PLAYER;if(!P||P.i===0)return;P.i--;renderStep()}
function summaryHtml(){const P=PLAYER;let s=0,t=0;Object.values(P.res).forEach(r=>{s+=r.s;t+=r.t});const pass=t===0||s/t>=0.6;const n=P.n;
  if(!P.finished){P.finished=true;const prev=state.done[n]||{};state.done[n]={done:!!(prev.done||pass),best:Math.max(prev.best||0,t?Math.round(s/t*100):100)};if(pass&&P.steps.cards)addCards(P.steps.cards);recordDay();save()}
  const added=pass&&P.steps.cards?P.steps.cards.length:0;const nx=n+1<DAYS.length?n+1:null;
  return`<div class="result"><p class="eyebrow">Ngày ${n+1} · ${esc(dayTitle(DAYS[n]))}</p>${t?`<span class="score">${s}/${t}</span>`:''}<h2>${pass?'Hoàn thành!':'Gần được rồi'}</h2><p>${pass?(nx!=null?`Ngày ${nx+1} đã mở.`:'Bạn đã đi hết lộ trình hiện có. Vườn đã ra hoa!')+(added?` ${added} thẻ mới đã vào Ôn tập, sẽ hiện lại từ ngày mai.`:''):'Cần đúng từ 60% để mở ngày tiếp theo. Xem lại phần học một chút rồi thử lại nhé, không vội.'}</p>
  <div class="row">${pass&&nx!=null?`<button class="btn primary big" data-act="go" data-to="day-${nx}">Học tiếp Ngày ${nx+1}</button>`:''}${pass?'':`<button class="btn primary" data-act="restartDay">Học lại ngày này</button>`}<button class="btn ghost" data-act="go" data-to="home">Về trang Hôm nay</button></div>
  ${pass&&nx!=null?`<p class="small muted">Mẹo: mỗi ngày học 1 bài là đủ. Ngày mai mở mục Ôn tập trước rồi mới học bài mới.</p>`:''}</div>`}

/* ========== quiz engine ========== */
let QUIZ=null;
function startQuiz(el,qs,onDone){QUIZ={el,qs,i:0,score:0,answered:false,onDone,sel:{}};drawQuiz();sayQ()}
function sayQ(){const q=QUIZ&&QUIZ.qs[QUIZ.i];if(!q)return;if(q.say)speak(q.say,'zh');else if(q.sayEn)speak(q.sayEn,'en')}
function drawQuiz(){const z=QUIZ,q=z.qs[z.i];z.sel={};let body;
  if(q.type==='build'){body=`<div class="build">${[['ini','Âm đầu',x=>x],['fin','Vần',x=>x],['t','Thanh',t=>`<span class="t${t}">${contour(t)}</span>`]].map(([k,lab,f])=>`<div class="slot"><span>${lab}</span><div class="choices">${q.choices[k].map(v=>`<button data-act="bpick" data-k="${k}" data-v="${v}" aria-pressed="false" aria-label="${lab} ${v}">${f(v)}</button>`).join('')}</div></div>`).join('')}<div class="row"><span class="preview" id="bprev"></span></div><div class="row"><button class="btn primary" data-act="bcheck" id="bcheck" disabled>Kiểm tra</button></div></div>`}
  else body=`<div class="opts ${q.optsClass||''}">${q.opts.map((o,k)=>`<button class="opt" data-act="ans" data-k="${k}">${o.html}</button>`).join('')}</div>`;
  const play=q.say?`<button class="play big" data-say="${esc(q.say)}">${ICON.play}<span>Nghe lại</span></button>`:q.sayEn?`<button class="play en big" data-say-en="${esc(q.sayEn)}">${ICON.play}<span>Listen again</span></button>`:'';
  z.el.innerHTML=`<div class="quiz"><div class="qbar"><span>Câu ${z.i+1}/${z.qs.length}</span><div class="dots">${z.qs.map((_,k)=>`<i class="${k<z.i?'d':k===z.i?'c':''}"></i>`).join('')}</div></div><p class="qprompt">${q.prompt}</p>${q.show?`<div class="qshow">${q.show}</div>`:''}${play}${body}<div class="qfeed" id="qfeed"></div></div>`}
function feedback(ok,q){const z=QUIZ;if(ok)z.score++;if(q.after)speak(q.after,'zh');
  $('#qfeed').innerHTML=`<p class="verdict ${ok?'ok':'bad'}">${ok?'Chính xác!':'Chưa đúng, không sao.'}</p>${q.explain||''}<div class="row"><button class="btn primary" data-act="next">${z.i+1<z.qs.length?'Câu tiếp':'Tiếp tục'}</button></div>`;
  $('#qfeed').scrollIntoView({block:'nearest',behavior:'smooth'})}
function answer(k){const z=QUIZ;if(!z||z.answered)return;z.answered=true;const q=z.qs[z.i];const ok=q.opts[k].ok;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('ok');else if(i===k)b.classList.add('bad')});feedback(ok,q)}
function nextQ(){const z=QUIZ;if(!z)return;z.i++;z.answered=false;if(z.i>=z.qs.length){const{score,qs,onDone}=z;QUIZ=null;onDone(score,qs.length);return}drawQuiz();sayQ()}
function bpick(btn){const z=QUIZ;if(z.answered)return;const k=btn.dataset.k,v=btn.dataset.v;z.sel[k]=k==='t'?+v:v;btn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===btn));const s=z.sel;$('#bprev').textContent=(s.ini||'_')+(s.fin||'__');if(s.ini&&s.fin&&s.t)$('#bprev').innerHTML=colorPy(mark(s.ini+s.fin,s.t));$('#bcheck').disabled=!(s.ini&&s.fin&&s.t)}
function bcheck(){const z=QUIZ;if(z.answered)return;z.answered=true;const q=z.qs[z.i],s=z.sel,a=q.ans;const ok=s.ini===a.ini&&s.fin===a.fin&&s.t===a.t;document.querySelectorAll('.build .choices button').forEach(b=>{b.disabled=true;const k=b.dataset.k,v=k==='t'?+b.dataset.v:b.dataset.v;if(v===a[k])b.classList.add('ok');else if(v===s[k])b.classList.add('bad')});$('#bcheck').hidden=true;feedback(ok,q)}

/* ========== review (spaced repetition) ========== */
let REV=null;
function viewReview(){const due=dueIds();const total=Object.keys(state.srs).length;
  if(!due.length){const nextD=Object.values(state.srs).map(c=>c.d).sort()[0];return`<section class="hello"><p class="eyebrow">Ôn tập</p><h1>Ôn tập hôm nay</h1><p class="sub">Thẻ từ bạn đã học sẽ quay lại đúng lúc sắp quên: sau 1, 2, 4, 7, 15 rồi 30 ngày.</p></section><p class="empty">${total?`Hôm nay không còn thẻ nào cần ôn. Thẻ tiếp theo đến hạn ngày ${nextD.split('-').reverse().join('/')}.`:'Chưa có thẻ nào. Học xong một ngày “Từ mới” ở Giai đoạn 2, từ vựng sẽ vào đây.'}</p>`}
  return`<section class="hello"><p class="eyebrow">Ôn tập</p><h1>${due.length} thẻ cần ôn</h1><p class="sub">Nhìn mặt trước, tự nhớ nghĩa và cách đọc, rồi lật thẻ. Chọn thật lòng, thẻ khó sẽ quay lại sớm hơn.</p></section><div class="row"><button class="btn primary big" data-act="revStart">Bắt đầu ôn ${Math.min(due.length,20)} thẻ</button></div>`}
function revStart(){REV={q:shuffle(dueIds()).slice(0,20),i:0,ok:0,flipped:false,again:new Set()};drawRev()}
function drawRev(){const v=$('#view');const R=REV;if(R.i>=R.q.length){v.innerHTML=`<div class="result"><p class="eyebrow">Ôn tập</p><h1>Xong rồi!</h1><p>Bạn đã ôn ${R.q.length} lượt thẻ. Hẹn gặp lại các thẻ này vào ngày đến hạn.</p><div class="row"><button class="btn primary" data-act="go" data-to="home">Về trang Hôm nay</button></div></div>`;REV=null;recordDay();save();return}
  const id=R.q[R.i],c=CARD[id];const front=c.lang==='zh'?`${LZH}<span class="hz" ${c.sent?'style="font-size:2.2rem"':''}>${esc(c.hz)}</span>${playZh(c.say||c.hz)}`:`${LEN}<span class="w">${esc(c.w)}</span>${playEn(c.w)}`;
  const back=c.lang==='zh'?`<span class="py" style="font-size:1.4rem">${colorPy(c.py)}</span><b>${esc(c.vi)}</b>${c.en?`<span class="muted">${esc(c.en)}</span>`:''}${c.ex?`<span class="small"><span class="hz">${esc(c.ex)}</span> · ${esc(c.exVi)}</span>`:''}`:`<b>${esc(c.vi)}</b><span class="small">${esc(c.ex)}</span>`;
  v.innerHTML=`<div class="player"><div class="phead"><button class="pclose" data-act="go" data-to="home" aria-label="Dừng ôn tập">✕</button><div class="bar"><i style="width:${Math.round(R.i/R.q.length*100)}%"></i></div><span class="pcount">${R.i+1}/${R.q.length}</span></div><div class="flash">${front}${R.flipped?`<div class="back">${back}</div>`:''}</div><div class="row" style="justify-content:center">${R.flipped?`<button class="btn big" data-act="revGrade" data-ok="0">Chưa nhớ</button><button class="btn primary big" data-act="revGrade" data-ok="1">Nhớ rồi</button>`:`<button class="btn primary big" data-act="revFlip">Lật thẻ</button>`}</div></div>`;
  if(!R.flipped)speak(c.lang==='zh'?(c.say||c.hz):c.w,c.lang)}
function revGrade(ok){const R=REV;const id=R.q[R.i];const c=state.srs[id]||{b:0};if(ok){if(!R.again.has(id))c.b=Math.min((c.b||0)+1,INT.length-1);c.d=addDays(INT[c.b]);R.ok++}else{c.b=0;c.d=TODAY();if(!R.again.has(id)){R.again.add(id);R.q.push(id)}}state.srs[id]=c;save();R.i++;R.flipped=false;drawRev()}

function setNav(r){document.querySelectorAll('#nav button').forEach(b=>{const t=b.dataset.to;const on=t===r||(t==='path'&&r.startsWith('day-'))||(t==='practice'&&(r.startsWith('game-')||r==='write'));if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function render(){QUIZ=null;PLAYER=null;REV=null;const r=(location.hash||'#home').slice(1)||'home';setNav(r);const v=$('#view');
  if(r.startsWith('day-')){v.innerHTML=viewDay(+r.slice(4));if(PLAYER)renderStep()}

  updateBadge();window.scrollTo(0,0)}
