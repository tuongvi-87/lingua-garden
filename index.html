const go=to=>{if(location.hash==='#'+to)render();else location.hash=to};

function viewHome(){const dc=doneCount(),nx=nextDay(),due=dueIds().length,st=streak();const today=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  const cnt=ph=>[DAYS.filter(d=>d.phase===ph).length,DAYS.filter((d,i)=>d.phase===ph&&isDone(i)).length];
  const bars=[1,2,3].map(ph=>{const[t,dn]=cnt(ph);return`<div class="ph"><span class="small"><b>Giai đoạn ${ph}</b> · ${PHASES[ph]}</span><span class="small muted">${dn}/${t}</span><div class="bar"><i style="width:${dn/t*100}%"></i></div></div>`}).join('');
  let todayCard;
  if(nx==null)todayCard=`<div class="card today"><span class="glyph" aria-hidden="true">花</span><p class="eyebrow">Lộ trình</p><h2>Bạn đã xong ${DAYS.length} ngày học!</h2><p class="muted">Giai đoạn 4–5 đang được soạn. Trong lúc chờ, hãy ôn tập mỗi ngày và chơi ở mục Luyện thêm.</p></div>`;
  else{const d=DAYS[nx];const g=d.phase===1?'音':d.phase===3?'字':UNITS[d.ui].hz[0];
    todayCard=`<div class="card today"><span class="glyph" aria-hidden="true">${d.phase===3?'字':g}</span><p class="eyebrow">Bài hôm nay · Ngày ${nx+1}/${DAYS.length}</p><h2>${esc(dayTitle(d))}</h2><div class="parts"><div>${LZH}<span>${hzWrap(d.zh)}</span></div><div>${LEN}<span>${esc(d.en)}</span></div></div><p class="small muted">Khoảng ${d.min} phút</p><div class="row"><button class="btn primary big" data-act="go" data-to="day-${nx}">${dc?'Học tiếp':'Bắt đầu học'}</button><button class="btn ghost" data-act="go" data-to="path">Xem lộ trình</button></div></div>`}
  return`<section class="hello"><p class="eyebrow">${esc(today)}</p><h1>Hôm nay học gì?</h1><p class="sub">Mỗi ngày một bài, mỗi bài có cả tiếng Trung và tiếng Anh. Học xong thì ôn, không cần học thuộc lòng. Nghỉ một hôm cũng không sao.</p></section>
  <div class="grid2">${todayCard}
   <div class="card"><p class="eyebrow">Ôn tập</p><h2>${due?`${due} thẻ đến hạn`:'Không có thẻ cần ôn'}</h2><p class="small muted">${due?'Ôn trước khi học bài mới, khoảng 3–5 phút.':Object.keys(state.srs).length?'Bạn đã ôn đủ hôm nay.':'Từ vựng bạn học ở Giai đoạn 2 sẽ tự vào đây.'}</p><div class="row">${due?`<button class="btn primary" data-act="go" data-to="review">Ôn ngay</button>`:''}<button class="btn ghost" data-act="go" data-to="practice">Luyện thêm</button></div>
   <div class="plantbox">${plant(dc,DAYS.length)}<div class="phase-bars" style="flex:1;min-width:0">${bars}</div></div></div>
  </div>
  <div class="grid4"><div class="stat"><b>${dc}</b><span>Ngày đã học xong</span></div><div class="stat"><b>${st}</b><span>Ngày liên tiếp</span></div><div class="stat"><b>${Object.keys(state.srs).length}</b><span>Thẻ trong bộ ôn tập</span></div><div class="stat"><b>${state.days.length}</b><span>Ngày có học</span></div></div>
  ${voicePanel()}`}
function voicePanel(){return`<section class="card"><h3>Âm thanh</h3><p class="small" id="voiceStatus">${voiceText()}</p><div class="voice-line"><button class="play" data-say="你好，我们开始吧">${ICON.play}<span>Thử tiếng Trung</span></button><button class="play en" data-say-en="Hello, let's get started.">${ICON.play}<span>Try English</span></button><span class="small muted">Tốc độ</span><div class="seg" role="group" aria-label="Tốc độ đọc">${[[0.6,'Chậm'],[0.8,'Vừa'],[1,'Thường']].map(([r,l])=>`<button data-act="rate" data-r="${r}" aria-pressed="${state.rate===r}">${l}</button>`).join('')}</div></div><p class="small muted">Không nghe thấy gì? Tăng âm lượng và tắt chế độ im lặng của iPad. Nếu vẫn không có tiếng, mở trang bằng Safari.</p></section>`}

function viewPath(){const nx=nextDay();const row=(n)=>{const d=DAYS[n];const dn=isDone(n),u=unlocked(n),now=n===nx;return`<button class="lrow ${dn?'done':now?'now':u?'':'locked'}" data-act="go" data-to="day-${n}" ${u?'':'aria-disabled="true"'}><span class="n">${dn?ICON.check:n+1}</span><span class="tx"><b>${esc(d.phase===2?`Ngày ${n+1} · ${PART[d.p].t}`:`Ngày ${n+1} · ${dayTitle(d)}`)}</b><small>${LZH} ${hzWrap(d.zh)} ${LEN} ${esc(d.en)}</small></span>${dn?'<span class="pill done">Đã xong</span>':now?'<span class="pill now">Hôm nay</span>':u?'':`<span class="pill">${ICON.lock}</span>`}</button>`};
  const p1=DAYS.map((d,i)=>[d,i]).filter(([d])=>d.phase===1);
  return`<section class="hello"><p class="eyebrow">Lộ trình song ngữ</p><h1>Tiếng Trung từ số 0 + Tiếng Anh hướng IELTS</h1><p class="sub">Mỗi ngày một bài khoảng 12–15 phút, học cả hai ngôn ngữ cùng một chủ đề. Bài sau mở khi bạn làm đúng từ 60% bài trước. Từ vựng đã học tự vào mục Ôn tập.</p></section>
  <div class="note"><h3>Vì sao học theo thứ tự này?</h3><ul><li><b>Giai đoạn 1 · Âm thanh trước.</b> Tiếng Trung học Pinyin và thanh điệu; tiếng Anh sửa phát âm (IPA, âm cuối, trọng âm). Phát âm đúng từ đầu thì nghe và nói về sau dễ hơn nhiều.</li><li><b>Giai đoạn 2 · Giao tiếp theo chủ đề.</b> Mỗi chủ đề học trong 3 ngày: từ mới → mẫu câu & ngữ pháp → hội thoại & nói. Tiếng Anh dùng luôn câu hỏi IELTS Speaking Part 1.</li><li><b>Giai đoạn 3 · Chữ Hán & cấu tạo từ.</b> Bộ thủ chữ Hán và tiền tố, hậu tố tiếng Anh cùng dạy một kỹ năng: nhìn các mảnh ghép để đoán nghĩa. Có khung tập viết chữ bằng ngón tay.</li><li><b>Mỗi ngày nên:</b> ôn thẻ đến hạn (3–5 phút) rồi học bài mới.</li></ul></div>
  <section class="level"><div class="level-head"><h2>Giai đoạn 1 · Nền âm thanh</h2><span class="pill">${p1.filter(([,i])=>isDone(i)).length}/${p1.length} ngày</span></div><div class="lessons">${p1.map(([,i])=>row(i)).join('')}</div></section>
  <section class="level"><div class="level-head"><h2>Giai đoạn 2 · Giao tiếp theo chủ đề</h2><span class="pill">${UNITS.length} chủ đề · ${UNITS.length*3} ngày</span></div>
  ${UNITS.map((u,ui)=>`<div class="lessons"><div class="uhead"><span class="hz">${esc(u.hz)}</span><span>Chủ đề ${ui+1} · ${esc(u.vi)}</span><span class="muted small">${esc(u.en)}</span></div>${DAYS.map((d,i)=>[d,i]).filter(([d])=>d.phase===2&&d.ui===ui).map(([,i])=>row(i)).join('')}</div>`).join('')}</section>
  <section class="level"><div class="level-head"><h2>Giai đoạn 3 · Chữ Hán & cấu tạo từ</h2><span class="pill">${DAYS.filter((d,i)=>d.phase===3&&isDone(i)).length}/${ZH3.length} ngày</span></div><div class="lessons">${DAYS.map((d,i)=>[d,i]).filter(([d])=>d.phase===3).map(([,i])=>row(i)).join('')}</div></section>
  <section class="level"><div class="level-head"><h2>Các giai đoạn tiếp theo</h2><span class="small muted">Đang soạn, mở sau Giai đoạn 3</span></div><div class="locked-levels">${LATER.map(L=>`<div class="lv"><b>${esc(L.t)}</b><ul>${L.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></section>`}

const GAMES=[
 {id:'tone',t:'Bắt thanh điệu',d:'Nghe một chữ, chọn đúng 1 trong 4 thanh.',art:`<span class="t1">ā</span><span class="t2">á</span><span class="t3">ǎ</span><span class="t4">à</span>`,make:()=>many(Q.toneListen,10)},
 {id:'pairs',t:'Đôi tai tinh',d:'Nghe và chọn giữa hai âm tiếng Trung rất giống nhau.',art:`<span>zh</span><span class="muted">/</span><span>z</span>`,make:()=>uniq(Q.pair,10)},
 {id:'enpairs',t:'Ship hay Sheep?',d:'Nghe và phân biệt các cặp âm tiếng Anh dễ nhầm.',art:`<span style="color:var(--navy)">ship</span><span class="muted">/</span><span style="color:var(--navy)">sheep</span>`,make:()=>sample([...EN_SHORT,...EN_END,...EN_CONS],10).map(([a,b,t])=>enPair(a,b,t))},
 {id:'build',t:'Ghép âm tiết',d:'Nghe rồi tự ghép âm đầu + vần + thanh.',art:`<span>b</span><span class="muted">+</span><span>a</span><span class="muted">+</span><span class="t4">ˋ</span>`,make:()=>uniq(Q.build,10)},
 {id:'mark',t:'Đặt dấu thanh',d:'Chọn đúng chữ cái mang dấu. Không cần âm thanh.',art:`<span>h</span><span class="t3">ǎ</span><span>o</span>`,make:()=>uniq(Q.markPlace,10)},
 {id:'vocab',t:'Từ vựng đã học',d:'Trộn từ tiếng Trung và tiếng Anh bạn đã học.',art:`<span class="hz">你好</span><span class="muted">·</span><span style="color:var(--navy)">hello</span>`,need:4,make:()=>{const ids=Object.keys(state.srs).filter(id=>id.startsWith('zw:')||id.startsWith('ew:'));const zw=[],ew=[];UNITS.forEach(u=>{u.zw.forEach(w=>{if(ids.includes('zw:'+w[0]))zw.push(w)});u.ew.forEach(w=>{if(ids.includes('ew:'+w[0]))ew.push(w)})});const fake={zw:zw.length>=4?zw:UNITS[0].zw,ew:ew.length>=4?ew:UNITS[0].ew};return shuffle(unitQuizVocab(fake,Math.min(5,fake.zw.length),Math.min(5,fake.ew.length)))}}
];
function viewPractice(){const learned=Object.keys(state.srs).length;return`<section class="hello"><p class="eyebrow">Luyện thêm</p><h1>Trò chơi luyện tai</h1><p class="sub">Không bắt buộc. Chơi lúc rảnh để tai quen âm, mỗi lượt 10 câu khoảng 3 phút.</p></section>
  <div class="card"><div class="row" style="justify-content:space-between"><div style="display:flex;gap:14px;align-items:center"><span class="hz" style="font-size:2.6rem;color:var(--seal)">写</span><div><h3>Luyện viết chữ Hán</h3><p class="small muted">Chọn một chữ, xem cách viết rồi dùng ngón tay viết theo. ${Object.keys(HWD).length} chữ.</p></div></div><button class="btn primary" data-act="go" data-to="write">Luyện viết</button></div></div>
  <div class="games">${GAMES.map(g=>{const s=state.games[g.id];const locked=g.need&&learned<g.need;return`<div class="card"><div class="art">${g.art}</div><h3>${esc(g.t)}</h3><p class="small muted">${esc(g.d)}</p><div class="row" style="justify-content:space-between">${locked?'<span class="small muted">Mở khi bạn học xong ngày Từ mới đầu tiên</span>':s?`<span class="small muted">Cao nhất ${s.best}/10 · ${s.plays} lượt</span>`:'<span class="small muted">Chưa chơi</span>'}<button class="btn primary" data-act="go" data-to="game-${g.id}" ${locked?'disabled':''}>Chơi</button></div></div>`}).join('')}</div>`}
function viewWrite(){const chars=Object.keys(HWD);const first=WRITE10.find(c=>HWD[c])||chars[0];return`<button class="btn ghost" data-act="go" data-to="practice" style="align-self:flex-start">← Luyện thêm</button><section class="hello"><p class="eyebrow">Luyện viết</p><h1>Luyện viết chữ Hán</h1><p class="sub">Chọn chữ ở dưới. Màu đỏ trong chữ là bộ thủ.</p></section>
  <div id="wbig" style="display:flex;justify-content:center">${first?hwCard(first,true):''}</div>
  <div class="chips">${chars.map(c=>`<button class="chip" data-act="wpick" data-c="${esc(c)}" data-say="${esc(c)}"><span class="hz">${esc(c)}</span>${IDX[c]?`<span class="py">${colorPy(IDX[c].py)}</span>`:''}</button>`).join('')}</div>`}
function viewGame(id){const g=GAMES.find(x=>x.id===id);if(!g)return viewPractice();const s=state.games[id];return`<button class="btn ghost" data-act="go" data-to="practice" style="align-self:flex-start">← Luyện thêm</button><section class="hello"><p class="eyebrow">Trò chơi</p><h1>${esc(g.t)}</h1><p class="sub">${esc(g.d)}</p></section><section id="gbody"><div class="card" style="max-width:560px"><div class="art" style="height:96px">${g.art}</div><p class="small muted">${s?`Điểm cao nhất ${s.best}/10.`:'Lượt đầu tiên của bạn.'}</p><div class="row"><button class="btn primary" data-act="gstart" data-id="${id}">Bắt đầu 10 câu</button></div></div></section>`}
function startGame(id){const g=GAMES.find(x=>x.id===id);const el=$('#gbody');startQuiz(el,g.make(),(score,total)=>{const p=state.games[id]||{best:0,plays:0};const rec=score>p.best&&p.plays;state.games[id]={best:Math.max(p.best,score),plays:(p.plays||0)+1};recordDay();save();const st=score>=total*.9?3:score>=total*.6?2:1;el.innerHTML=`<div class="result"><p class="eyebrow">Kết quả</p>${stars(st)}<span class="score">${score}/${total}</span><p>${rec?'Kỷ lục mới!':score>=total*.8?'Tai bạn đang tinh dần lên.':'Mỗi lượt chơi là một lần tai được luyện. Thử thêm lượt nữa nhé.'}</p><div class="row"><button class="btn primary" data-act="gstart" data-id="${id}">Chơi lại</button><button class="btn ghost" data-act="go" data-to="practice">Trò chơi khác</button></div></div>`})}

function viewWords(){const zh=[],en=[];Object.keys(state.srs).forEach(id=>{const c=CARD[id];if(!c)return;if(c.lang==='zh')zh.push(c);else en.push(c)});
  state.saved.forEach(k=>{if(k.startsWith('en:')){const w=ENIDX[k.slice(3)];if(w&&!en.find(c=>c.w===w.w))en.push({w:w.w,vi:w.vi,ex:w.ex})}else{const w=IDX[k];if(w&&!zh.find(c=>c.hz===w.hz))zh.push({hz:w.hz,py:w.py,vi:w.vi})}});
  const zr=zh.map(c=>`<div class="wrow">${playZh(c.say||c.hz)}<span class="hz">${esc(c.hz)}</span><div class="tx"><span class="py">${colorPy(c.py)}</span><small>${esc(c.vi)}</small></div>${saveBtn(c.hz)}</div>`).join('');
  const er=en.map(c=>`<div class="wrow">${playEn(c.w)}<span class="w">${esc(c.w)}</span><div class="tx"><span>${esc(c.vi)}</span><small>${esc(c.ex||'')}</small></div>${saveBtn('en:'+c.w)}</div>`).join('');
  return`<section class="hello"><p class="eyebrow">Sổ từ</p><h1>Từ đã học</h1><p class="sub">Gồm từ đã vào bộ ôn tập và những từ bạn đánh dấu sao. Bấm loa để nghe lại.</p></section>
  ${zh.length||en.length?`<section class="level"><div class="level-head"><h2>${LZH} Tiếng Trung</h2><span class="small muted">${zh.length} từ</span></div>${zh.length?`<div class="words">${zr}</div>`:'<p class="empty">Chưa có từ tiếng Trung.</p>'}</section><section class="level"><div class="level-head"><h2>${LEN} Tiếng Anh</h2><span class="small muted">${en.length} từ</span></div>${en.length?`<div class="words">${er}</div>`:'<p class="empty">Chưa có từ tiếng Anh.</p>'}</section>`:`<p class="empty">Chưa có từ nào. Học xong ngày “Từ mới” đầu tiên ở Giai đoạn 2, từ vựng sẽ hiện ở đây.</p>`}`}

/* ========== actions ========== */
let quickItem=null,timerId=null;
const ACT={
 go:a=>{if(a.getAttribute('aria-disabled')==='true'){toast('Học xong ngày trước để mở ngày này');return}go(a.dataset.to)},
 ans:a=>answer(+a.dataset.k),next:()=>nextQ(),bpick:a=>bpick(a),bcheck:()=>bcheck(),
 pnext:()=>pnext(),pback:()=>pback(),
 restartDay:()=>{if(!PLAYER)return;PLAYER={n:PLAYER.n,steps:buildSteps(PLAYER.n),i:0,res:{},finished:false};renderStep()},
 gstart:a=>startGame(a.dataset.id),
 save:a=>{const k=a.dataset.k;const i=state.saved.indexOf(k);if(i>=0)state.saved.splice(i,1);else state.saved.push(k);save();const on=i<0;document.querySelectorAll(`.save[data-k="${CSS.escape(k)}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});toast(on?'Đã lưu vào Sổ từ':'Đã bỏ khỏi Sổ từ')},
 rate:a=>{state.rate=+a.dataset.r;save();a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===a));speak('你好','zh')},
 quick:()=>{quickItem=toneItem();speak(quickItem.hz,'zh');$('#quickShow').disabled=false;$('#quickAns').innerHTML=''},
 quickShow:()=>{if(quickItem)$('#quickAns').innerHTML=`<div style="margin-top:10px">${revealZh(quickItem.hz,quickItem.py,quickItem.vi)}</div>`},
 playDialog:a=>{const u=UNITS[+a.dataset.u];speakQueue(u.dl.map(l=>[l[1],'zh']))},
 toggleDl:a=>{const on=a.getAttribute('aria-pressed')!=='true';a.setAttribute('aria-pressed',on);$('#dlg').classList.toggle(a.dataset.c,on)},
 showSample:a=>{const el=$('#sample'+a.dataset.i);el.hidden=false;a.hidden=true},
 timer:a=>{clearInterval(timerId);let s=45;const el=$('#tmr');a.textContent='Đếm lại';el.textContent='0:45';timerId=setInterval(()=>{s--;if(!document.body.contains(el)){clearInterval(timerId);return}el.textContent='0:'+pad(Math.max(s,0));if(s<=0){clearInterval(timerId);el.textContent='Hết giờ!'}},1000)},
 hwAnim:a=>{const el=a.closest('.hw');const w=WRITERS.get(el);if(!w)return;speak(el.dataset.hw,'zh');try{w.cancelQuiz&&w.cancelQuiz()}catch(e){}w.showCharacter();w.animateCharacter();el.querySelector('.hwmsg').textContent='Xem thứ tự từng nét…'},
 hwQuiz:a=>{const el=a.closest('.hw');const w=WRITERS.get(el);if(!w)return;const m=el.querySelector('.hwmsg');m.textContent='Viết nét đầu tiên vào ô…';w.quiz({onComplete:s=>{m.textContent=s.totalMistakes?`Xong! Có ${s.totalMistakes} lần chệch nét, viết lại lần nữa nhé.`:'Tuyệt, đúng hết các nét!';speak(el.dataset.hw,'zh')}})},
 wpick:a=>{const c=a.dataset.c;const box=$('#wbig');box.innerHTML=hwCard(c,true);mountHW(box);box.scrollIntoView({block:'nearest',behavior:'smooth'})},
 playRead:()=>speakQueue(READ.map(l=>[l[0],'zh'])),
 revStart:()=>revStart(),revFlip:()=>{REV.flipped=true;drawRev()},revGrade:a=>revGrade(a.dataset.ok==='1')
};
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s)speak(s.dataset.say,'zh');const se=e.target.closest('[data-say-en]');if(se&&!s)speak(se.dataset.sayEn,'en');const a=e.target.closest('[data-act]');if(a&&!a.disabled&&ACT[a.dataset.act])ACT[a.dataset.act](a,e)});

render();
initCloud();
</script>

</body>
